spring.application.name=vacantes-escolares
server.address=${APP_HOST:127.0.0.1}
server.port=${APP_PORT:8087}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.tomcat.max-http-form-post-size=64KB
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/vacantes_escolares?connectionTimeZone=%2B00:00&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:vacantes_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.thymeleaf.cache=false
spring.messages.encoding=UTF-8
spring.servlet.multipart.enabled=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
app.seed.enabled=${DEMO_SEED:true}
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:}
app.seed.admissions-password=${DEMO_ADMISSIONS_PASSWORD:}
app.seed.guardian-password=${DEMO_GUARDIAN_PASSWORD:}
app.seed.other-password=${DEMO_OTHER_PASSWORD:}
app.captcha.mode=${CAPTCHA_MODE:google}
app.captcha.site-key=${RECAPTCHA_SITE_KEY:}
app.captcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.captcha.allowed-hostnames=${RECAPTCHA_HOSTNAMES:localhost,127.0.0.1}
